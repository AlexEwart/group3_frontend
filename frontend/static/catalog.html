<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalog | Amazon but Better</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/static/app.js?v=4" defer></script>
</head>
<body data-page="catalog">
    <header class="navbar navbar-expand bg-white border-bottom">
        <nav class="container" aria-label="Main navigation">
            <a class="navbar-brand fw-semibold" href="/">Amazon but Better</a>
            <div class="d-flex flex-wrap align-items-center justify-content-end gap-2">
                <span id="session-status" class="small text-secondary"></span>
                <button id="open-signin" class="btn btn-outline-dark btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#sign-in-modal">Sign in</button>
                <a class="btn btn-dark btn-sm" href="/cart">View cart</a>
            </div>
        </nav>
    </header>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <p class="eyebrow mb-1">THE CATALOG</p>
                <h1 class="h2 mb-0">Shop products</h1>
            </div>
            <div role="search">
                <label class="visually-hidden" for="search-input">Search products</label>
                <input id="search-input" name="search_string" class="form-control" type="search" placeholder="Search products">
            </div>
        </div>
        <p id="page-message" class="text-secondary" role="status" aria-live="polite"></p>
        <section id="product-list" class="row g-3" aria-label="Products"></section>
    </main>
    <div class="modal fade" id="sign-in-modal" tabindex="-1" aria-labelledby="sign-in-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="sign-in-title">Sign in</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="sign-in-form">
                    <div class="modal-body">
                        <label class="form-label" for="user-id">User ID</label>
                        <input id="user-id" name="user_id" class="form-control" type="text" maxlength="80" placeholder="Enter your user ID" required autocomplete="username">
                    </div>
                    <div class="modal-footer">
                        <button id="sign-in-button" class="btn btn-dark" type="submit">Continue</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
