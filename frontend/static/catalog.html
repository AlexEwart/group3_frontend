<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalog | Simple Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>
<body data-page="catalog">
    <header class="navbar navbar-expand bg-white border-bottom">
        <nav class="container" aria-label="Main navigation">
            <a class="navbar-brand fw-semibold" href="/">Simple Store</a>
            <a class="btn btn-outline-dark btn-sm" href="/cart">View cart</a>
        </nav>
    </header>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <p class="eyebrow mb-1">THE CATALOG</p>
                <h1 class="h2 mb-0">Shop products</h1>
            </div>
            <form id="search-form" class="d-flex gap-2" role="search">
                <label class="visually-hidden" for="search-input">Search products</label>
                <input id="search-input" name="search_string" class="form-control" type="search" placeholder="Search products">
                <button class="btn btn-dark" type="submit">Search</button>
            </form>
        </div>
        <p id="page-message" class="text-secondary" role="status" aria-live="polite"></p>
        <section id="product-list" class="row g-3" aria-label="Products"></section>
    </main>
</body>
</html>
