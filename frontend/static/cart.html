<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart | Amazon but Better</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/static/app.js?v=4" defer></script>
</head>
<body data-page="cart">
    <header class="navbar navbar-expand bg-white border-bottom">
        <nav class="container" aria-label="Main navigation">
            <a class="navbar-brand fw-semibold" href="/">Amazon but Better</a>
            <div class="d-flex flex-wrap align-items-center justify-content-end gap-2">
                <span id="session-status" class="small text-secondary"></span>
                <button id="open-signin" class="btn btn-outline-dark btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#sign-in-modal">Sign in</button>
                <a class="btn btn-dark btn-sm" href="/">Catalog</a>
            </div>
        </nav>
    </header>
    <main class="container py-5">
        <p class="eyebrow mb-1">YOUR BAG</p>
        <h1 class="h2 mb-4">Shopping cart</h1>
        <p id="page-message" class="text-secondary" role="status" aria-live="polite"></p>
        <section id="cart-list" class="row g-3 mb-5" aria-label="Cart items"></section>
        <section id="checkout-section" class="card border-0 shadow-sm mb-5" aria-labelledby="checkout-heading" hidden>
            <div class="card-body p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2 mb-3">
                    <h2 id="checkout-heading" class="h4 mb-0">Checkout</h2>
                    <p id="checkout-amount" class="h5 mb-0"></p>
                </div>
                <form id="checkout-form" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="card-number">Card number</label>
                            <input id="card-number" name="card_number" class="form-control" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" pattern="[0-9 -]{12,23}" required>
                            <div class="invalid-feedback">Enter a valid card number.</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <label class="form-label" for="expiration-date">Expiration</label>
                            <input id="expiration-date" name="expiration_date" class="form-control" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])/[0-9]{2}([0-9]{2})?" required>
                            <div class="invalid-feedback">Use MM/YY or MM/YYYY.</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <label class="form-label" for="card-svn">Security code</label>
                            <input id="card-svn" name="svn" class="form-control" type="password" inputmode="numeric" autocomplete="cc-csc" placeholder="CVV" pattern="[0-9]{3,4}" required>
                            <div class="invalid-feedback">Enter the 3 or 4 digit security code.</div>
                        </div>
                        <div class="col-12 d-flex justify-content-end">
                            <button id="checkout-button" class="btn btn-dark" type="submit">Pay and place order</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
        <section aria-labelledby="recommendation-heading">
            <p class="eyebrow mb-1">PICKED FOR YOU</p>
            <h2 id="recommendation-heading" class="h4 mb-3">You may also like</h2>
            <div id="recommendation-list" class="row g-3"></div>
        </section>
        <div class="mt-4">
            <button id="clear-cart" class="btn btn-outline-secondary" type="button">Empty cart</button>
        </div>
    </main>
    <div class="modal fade" id="sign-in-modal" tabindex="-1" aria-labelledby="sign-in-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="sign-in-title">Sign in</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="sign-in-form">
                    <div class="modal-body">
                        <label class="form-label" for="user-id">User ID</label>
                        <input id="user-id" name="user_id" class="form-control" type="text" maxlength="80" placeholder="Enter your user ID" required autocomplete="username">
                    </div>
                    <div class="modal-footer">
                        <button id="sign-in-button" class="btn btn-dark" type="submit">Continue</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
